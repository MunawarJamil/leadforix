[project]
name = "leadforix"
version = "0.1.0"
description = "Leadforix AI Sales Platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.116.1",
    "httpx>=0.28.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.8.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["B008", "E501", "UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests requiring network access",
]
